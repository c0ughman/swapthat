# Base = app in /site. Build copies output to repo-root `.next` (netlify-build script) so
# publish (`.next`) is never the same directory as `base` (`/site`).
[build]
  base = "site"
  command = "npm ci && npm run netlify-build"
  publish = ".next"

[[plugins]]
  package = "./netlify/plugins/swapthat-next-publish"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
