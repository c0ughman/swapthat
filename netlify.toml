# Next app: /site. Local plugin runs before @netlify/plugin-nextjs and sets publish to site/.next
# so it never matches base, even if the Netlify app UI has Publish = site.
[build]
  base = "site"
  command = "npm run build"

[[plugins]]
  package = "./netlify/plugins/swapthat-next-publish"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
