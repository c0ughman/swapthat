# With `base = "site"`, `publish` is relative to that base, so use `.next` (→ `…/site/.next`), never
# `.` or the app folder alone — that makes publishDir === PACKAGE_PATH and @netlify/plugin-nextjs fails.
[build]
  base = "site"
  command = "npm ci && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
